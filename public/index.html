<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>FLUA Vivência Quântica</title>
  <link rel="icon" href="/static/img/favicon.png">
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #30233a; background: #f7f2fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 720px); padding: 40px; border-radius: 24px; background: #fff; box-shadow: 0 20px 60px rgba(55, 28, 75, .12); }
    img { display: block; width: 138px; height: auto; margin-bottom: 28px; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 3.5rem); }
    p { margin: 0 0 28px; color: #665a70; line-height: 1.6; }
    nav { display: grid; gap: 12px; }
    a { padding: 16px 18px; border-radius: 12px; color: #fff; background: #6f3f85; text-decoration: none; font-weight: 700; }
    a:hover, a:focus-visible { background: #522d65; }
  </style>
</head>
<body>
  <main>
    <img src="/static/img/logo-flua.png" alt="FLUA Vivência Quântica" width="276" height="87">
    <h1>FLUA Vivência Quântica</h1>
    <p>Escolha a página que deseja acessar.</p>
    <nav aria-label="Landing pages da FLUA">
      <a href="/as-chaves-da-saude">As Chaves da Saúde</a>
      <a href="/as-chaves-dos-relacionamentos">As Chaves dos Relacionamentos</a>
      <a href="/livro-flua">Livro FLUA</a>
    </nav>
  </main>
</body>
</html>
